name: Synchronize the tested v0.8.1 curation candidate once

on:
  pull_request:

permissions:
  contents: write

jobs:
  synchronize:
    if: github.event.pull_request.head.ref == 'release/v0.8.1-curation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the curation branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.8.1-curation
          fetch-depth: 5

      - name: Update browser routes for the new public landing page
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f'{path}: expected {expected} exact occurrence(s), found {count}'
                  )
              file.write_text(text.replace(old, new), encoding='utf-8')

          demo_route = "/index.html?demo=nasa-tlx-weighted"
          replace_exact(
              'source/tests/e2e/browser-accessibility.spec.ts',
              "await page.goto('/index.html');",
              f"await page.goto('{demo_route}');",
              expected=2,
          )
          replace_exact(
              'source/tests/e2e/landing.spec.ts',
              "page.getByRole('heading', { name: 'System Usability Scale' }),",
              "page.getByRole('heading', { level: 1, name: 'System Usability Scale', exact: true }),",
          )
          for path in [
              'source/tests/e2e-support/cross-browser-support.spec.ts',
              'source/tests/e2e-support/rf05-reflow.spec.ts',
              'source/tests/e2e-support/rf08-smiley-voice-access.spec.ts',
              'source/tests/e2e-support/rf09-support-setting-feedback.spec.ts',
          ]:
              replace_exact(
                  path,
                  "await page.goto('/index.html');",
                  f"await page.goto('{demo_route}');",
              )
          PY

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install the locked dependency graph
        working-directory: source
        run: npm ci

      - name: Record npm outdated without changing dependencies
        working-directory: source
        run: |
          set +e
          npm outdated --json > ../docs/evidence/DEPENDENCY-OUTDATED-v0.8.1.json
          status=$?
          set -e
          if [ ! -s ../docs/evidence/DEPENDENCY-OUTDATED-v0.8.1.json ]; then
            printf '{}\n' > ../docs/evidence/DEPENDENCY-OUTDATED-v0.8.1.json
          fi
          echo "npm outdated exit status: $status"

      - name: Record and enforce the npm security audit
        working-directory: source
        run: |
          set +e
          npm audit --json > ../docs/evidence/DEPENDENCY-AUDIT-v0.8.1.json
          status=$?
          set -e
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(
            fs.readFileSync('../docs/evidence/DEPENDENCY-AUDIT-v0.8.1.json', 'utf8'),
          );
          const total = report.metadata?.vulnerabilities?.total ?? 0;
          console.log(`Reported dependency vulnerabilities: ${total}`);
          if (total !== 0) process.exit(1);
          NODE
          test "$status" -eq 0

      - name: Run unit and component tests
        working-directory: source
        run: npm test -- --run

      - name: Build production output
        working-directory: source
        run: npm run build

      - name: Install browser engines
        working-directory: source
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run rendered-browser tests
        working-directory: source
        run: npm run test:browser

      - name: Run the cross-browser support matrix
        working-directory: source
        run: npm run test:browser-support

      - name: Build and synchronize the release tree
        working-directory: source
        run: npm run build:release

      - name: Audit current repository links
        run: python tools/audit_repository_links.py

      - name: Confirm the curated public boundary
        run: |
          test ! -e deliverables
          test ! -e docs/ethics
          test ! -e docs/OBSERVED-RESEARCHER-STUDY-PROTOCOL-v1.0.md
          test ! -e source/demo/accessible-nasa-tlx-v0.7.html
          test -e docs/PLANNED-STUDY-NOT-EXECUTED.md
          test -e docs/archive/README.md
          test -e docs/evidence/PRIVATE-ARCHIVE-RECEIPT-v0.8.1.json
          git diff --check

      - name: Remove this one-time workflow
        run: rm .github/workflows/v081-curation-sync-once.yml

      - name: Commit the exact tested source and generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/workflows/v081-curation-sync-once.yml \
            source/tests/e2e/browser-accessibility.spec.ts \
            source/tests/e2e/landing.spec.ts \
            source/tests/e2e-support/cross-browser-support.spec.ts \
            source/tests/e2e-support/rf05-reflow.spec.ts \
            source/tests/e2e-support/rf08-smiley-voice-access.spec.ts \
            source/tests/e2e-support/rf09-support-setting-feedback.spec.ts \
            source/package.json \
            source/package-lock.json \
            docs/evidence/DEPENDENCY-OUTDATED-v0.8.1.json \
            docs/evidence/DEPENDENCY-AUDIT-v0.8.1.json \
            docs/evidence/REPOSITORY-LINK-AUDIT-v0.8.1.json \
            docs/evidence/fidelity-source-of-truth.json \
            source/demo/accessible-questionnaire-platform-v0.8.html \
            index.html \
            study.html \
            assets \
            questionnaires
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "The v0.8.1 candidate is already synchronized."
            exit 0
          fi
          git commit -m "test: align v0.8.1 browser routes and synchronize release"
          git push origin HEAD:release/v0.8.1-curation
