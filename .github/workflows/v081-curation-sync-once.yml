name: One-time v0.8.1 curation, dependency and release synchronization

on:
  push:
    branches:
      - release/v0.8.1-curation

permissions:
  contents: write

jobs:
  verify-and-synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the curation branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.8.1-curation
          fetch-depth: 5

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Synchronize package metadata and install the locked dependency graph
        working-directory: source
        run: |
          npm version 0.8.1 --no-git-tag-version --allow-same-version
          npm ci

      - name: Record npm outdated without changing dependencies
        working-directory: source
        run: |
          set +e
          npm outdated --json > ../docs/evidence/DEPENDENCY-OUTDATED-v0.8.1.json
          status=$?
          set -e
          if [ ! -s ../docs/evidence/DEPENDENCY-OUTDATED-v0.8.1.json ]; then
            printf '{}\n' > ../docs/evidence/DEPENDENCY-OUTDATED-v0.8.1.json
          fi
          echo "npm outdated exit status: $status"

      - name: Record and enforce the npm security audit
        working-directory: source
        run: |
          set +e
          npm audit --json > ../docs/evidence/DEPENDENCY-AUDIT-v0.8.1.json
          status=$?
          set -e
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('../docs/evidence/DEPENDENCY-AUDIT-v0.8.1.json', 'utf8'));
          const total = report.metadata?.vulnerabilities?.total ?? 0;
          console.log(`Reported dependency vulnerabilities: ${total}`);
          if (total !== 0) process.exit(1);
          NODE
          test "$status" -eq 0

      - name: Run unit and component tests
        working-directory: source
        run: npm test -- --run

      - name: Build production output
        working-directory: source
        run: npm run build

      - name: Install browser engines
        working-directory: source
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run rendered-browser tests
        working-directory: source
        run: npm run test:browser

      - name: Run the cross-browser support matrix
        working-directory: source
        run: npm run test:browser-support

      - name: Build and synchronize the release
        working-directory: source
        run: npm run build:release

      - name: Audit current repository links
        run: python tools/audit_repository_links.py

      - name: Confirm removed public materials are absent
        run: |
          test ! -e deliverables
          test ! -e docs/ethics
          test ! -e docs/OBSERVED-RESEARCHER-STUDY-PROTOCOL-v1.0.md
          test ! -e source/demo/accessible-nasa-tlx-v0.7.html
          test -e docs/PLANNED-STUDY-NOT-EXECUTED.md
          test -e docs/archive/README.md

      - name: Remove this one-time workflow and check the candidate diff
        run: |
          rm .github/workflows/v081-curation-sync-once.yml
          git diff --check

      - name: Commit exact tested metadata, reports and generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .github/workflows/v081-curation-sync-once.yml \
            source/package.json \
            source/package-lock.json \
            docs/evidence/DEPENDENCY-OUTDATED-v0.8.1.json \
            docs/evidence/DEPENDENCY-AUDIT-v0.8.1.json \
            docs/evidence/REPOSITORY-LINK-AUDIT-v0.8.1.json \
            source/demo/accessible-questionnaire-platform-v0.8.html \
            index.html \
            study.html \
            assets \
            questionnaires
          if git diff --cached --quiet; then
            echo "No generated or report changes remain to commit."
            exit 0
          fi
          git commit -m "chore: synchronize the tested v0.8.1 curation release"
          git push origin HEAD:release/v0.8.1-curation
