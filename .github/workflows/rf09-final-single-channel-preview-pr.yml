name: RF-09 one-time final single-channel preview publisher

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.number == 77
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact synchronized runtime
        uses: actions/checkout@v4
        with:
          ref: 0fae81bb5b59115e809ae2c4ae32e72b2600cd0c
          path: runtime
          fetch-depth: 1

      - name: Check out gh-pages separately
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 1

      - name: Create only the new immutable preview
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW='pages/rf09-final-single-channel-preview'
          if [ -e "$PREVIEW" ]; then
            echo 'Refusing to overwrite an existing RF-09 final single-channel preview.' >&2
            exit 1
          fi
          mkdir -p "$PREVIEW"
          cp runtime/source/demo/accessible-questionnaire-platform-v0.8.html "$PREVIEW/index.html"
          printf '%s\n' '0fae81bb5b59115e809ae2c4ae32e72b2600cd0c' > "$PREVIEW/SOURCE-SHA.txt"

      - name: Commit and push only that preview directory
        working-directory: pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rf09-final-single-channel-preview
          CHANGED="$(git diff --cached --name-only)"
          printf '%s\n' "$CHANGED"
          test -n "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -v '^rf09-final-single-channel-preview/' | grep -q .; then
            echo 'Unexpected gh-pages path changed; refusing publish.' >&2
            exit 1
          fi
          git commit -m 'Publish immutable RF-09 final single-channel preview 0fae81bb'
          git push origin HEAD:gh-pages
