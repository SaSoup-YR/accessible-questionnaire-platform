name: One-time RF-07 generated release sync

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'agent/fix-rf07-speech-recognition-reliability'
    runs-on: ubuntu-latest
    steps:
      - name: Check out RF-07 candidate
        uses: actions/checkout@v4
        with:
          ref: agent/fix-rf07-speech-recognition-reliability
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Verify source and rebuild generated release
        working-directory: source
        run: |
          npm ci
          npm test -- --run
          npm run build:release

      - name: Commit synchronized generated release if changed
        run: |
          git add \
            source/demo/accessible-nasa-tlx-v0.7.html \
            source/demo/accessible-questionnaire-platform-v0.8.html \
            index.html \
            study.html \
            assets \
            questionnaires
          if git diff --cached --quiet; then
            echo "Generated release is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync RF-07 generated release"
          git push origin HEAD:agent/fix-rf07-speech-recognition-reliability
