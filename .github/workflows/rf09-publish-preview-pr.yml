name: RF-09 one-time preview publisher via PR

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.number == 77
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact synchronized runtime
        uses: actions/checkout@v4
        with:
          ref: d2c8ca5a2beba06bb281ed3db222a7a302f17702
          path: runtime
          fetch-depth: 1

      - name: Check out gh-pages separately
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 1

      - name: Create only the new immutable preview
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW='pages/rf09-speech-failover-preview'
          if [ -e "$PREVIEW" ]; then
            echo 'Refusing to overwrite an existing RF-09 speech-failover preview.' >&2
            exit 1
          fi
          mkdir -p "$PREVIEW"
          cp runtime/source/demo/accessible-questionnaire-platform-v0.8.html "$PREVIEW/index.html"
          printf '%s\n' 'd2c8ca5a2beba06bb281ed3db222a7a302f17702' > "$PREVIEW/SOURCE-SHA.txt"
          cmp --silent runtime/source/demo/accessible-questionnaire-platform-v0.8.html "$PREVIEW/index.html"
          sha256sum runtime/source/demo/accessible-questionnaire-platform-v0.8.html "$PREVIEW/index.html"

      - name: Commit and push only that preview directory
        working-directory: pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rf09-speech-failover-preview
          CHANGED="$(git diff --cached --name-only)"
          printf '%s\n' "$CHANGED"
          test -n "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -v '^rf09-speech-failover-preview/' | grep -q .; then
            echo 'Unexpected gh-pages path changed; refusing publish.' >&2
            exit 1
          fi
          # index.html is a generated standalone artifact and intentionally keeps
          # its generator formatting verbatim; byte identity above is the gate.
          git commit -m 'Publish immutable RF-09 speech-failover preview d2c8ca5a'
          git push origin HEAD:gh-pages
