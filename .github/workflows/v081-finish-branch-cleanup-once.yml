name: Finish v0.8.1 archived branch cleanup once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    if: github.event.pull_request.number == 84 && github.event.pull_request.head.ref == 'release/v0.8.1-curation'
    runs-on: ubuntu-latest
    env:
      ACTIVE_BRANCH: release/v0.8.1-curation
      ARCHIVE_BRANCH: archive/pre-v0.8.1-branch-tips
      INVENTORY: docs/archive/BRANCH-CLEANUP-INVENTORY-v0.8.1.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact curation branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.8.1-curation
          fetch-depth: 0

      - name: Fetch branches and tags without changing them
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --tags origin
          test -f "$INVENTORY"
          git rev-parse 'refs/tags/v0.8.0^{commit}' > /tmp/v080-before.txt

      - name: Select only superseded closed-PR branches
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          active = os.environ['ACTIVE_BRANCH']
          archive = os.environ['ARCHIVE_BRANCH']

          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/pulls?state=open&per_page=100',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'AQP-v0.8.1-final-branch-curation',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              open_pulls = json.load(response)
          open_heads = {pull['head']['ref'] for pull in open_pulls}

          raw = subprocess.check_output(
              ['git', 'for-each-ref', '--format=%(refname:short)%00%(objectname)', 'refs/remotes/origin/'],
              text=True,
          )
          heads = []
          for line in raw.splitlines():
              if not line.strip():
                  continue
              ref, sha = line.split('\0', 1)
              if ref == 'origin/HEAD':
                  continue
              heads.append({'branch': ref.removeprefix('origin/'), 'sha': sha})

          def preserve(branch: str) -> bool:
              return (
                  branch in {'main', 'gh-pages', active, archive}
                  or branch.startswith('archive/')
                  or branch in open_heads
              )

          stale = [entry for entry in heads if not preserve(entry['branch'])]
          preserved = [entry for entry in heads if preserve(entry['branch'])]

          Path('/tmp/stale-branches.json').write_text(
              json.dumps(stale, indent=2) + '\n', encoding='utf-8'
          )
          Path('/tmp/preserved-branches.json').write_text(
              json.dumps(preserved, indent=2) + '\n', encoding='utf-8'
          )

          print(f'Remote branches before finalization: {len(heads)}')
          print(f'Branches selected for deletion: {len(stale)}')
          for entry in stale:
              print(f"DELETE {entry['branch']} {entry['sha']}")
          for entry in preserved:
              print(f"KEEP   {entry['branch']} {entry['sha']}")
          PY

      - name: Anchor every remaining deleted tip before ref deletion
        id: archive
        run: |
          previous_archive="$(git rev-parse "refs/remotes/origin/$ARCHIVE_BRANCH")"
          tree="$(git rev-parse 'HEAD^{tree}')"
          mapfile -t stale_shas < <(jq -r '.[].sha' /tmp/stale-branches.json | sort -u)
          parents=(-p "$previous_archive")
          for sha in "${stale_shas[@]}"; do
            if [ "$sha" != "$previous_archive" ]; then
              parents+=(-p "$sha")
            fi
          done
          archive_tip="$(printf '%s\n' 'Anchor the final superseded branch tips before v0.8.1 ref cleanup.' | git commit-tree "$tree" "${parents[@]}")"
          git push origin "$archive_tip:refs/heads/$ARCHIVE_BRANCH"
          for sha in "${stale_shas[@]}"; do
            git merge-base --is-ancestor "$sha" "$archive_tip"
          done
          echo "archive_tip=$archive_tip" >> "$GITHUB_OUTPUT"

      - name: Delete only the recorded superseded branch refs
        run: |
          jq -r '.[].branch' /tmp/stale-branches.json | while IFS= read -r branch; do
            test -n "$branch"
            git push origin --delete "$branch"
          done

      - name: Verify the exact post-cleanup branch and tag state
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --tags origin
          test "$(git rev-parse 'refs/tags/v0.8.0^{commit}')" = "$(cat /tmp/v080-before.txt)"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          active = os.environ['ACTIVE_BRANCH']
          archive = os.environ['ARCHIVE_BRANCH']
          stale = json.loads(Path('/tmp/stale-branches.json').read_text(encoding='utf-8'))
          raw = subprocess.check_output(
              ['git', 'for-each-ref', '--format=%(refname:short)%00%(objectname)', 'refs/remotes/origin/'],
              text=True,
          )
          current = {}
          for line in raw.splitlines():
              if not line.strip():
                  continue
              ref, sha = line.split('\0', 1)
              if ref == 'origin/HEAD':
                  continue
              current[ref.removeprefix('origin/')] = sha

          for entry in stale:
              if entry['branch'] in current:
                  raise SystemExit(f"deleted branch still exists: {entry['branch']}")

          unexpected = [
              branch for branch in current
              if not (
                  branch in {'main', 'gh-pages', active, archive}
                  or branch.startswith('archive/')
              )
          ]
          if unexpected:
              raise SystemExit('unexpected non-archive branches remain: ' + ', '.join(sorted(unexpected)))

          Path('/tmp/post-cleanup-branches.json').write_text(
              json.dumps(
                  [{'branch': branch, 'sha': sha} for branch, sha in sorted(current.items())],
                  indent=2,
              ) + '\n',
              encoding='utf-8',
          )
          print('Post-cleanup branches:')
          for branch, sha in sorted(current.items()):
              print(branch, sha)
          PY

      - name: Finalize the durable cleanup inventory
        env:
          ARCHIVE_TIP: ${{ steps.archive.outputs.archive_tip }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          import subprocess
          from pathlib import Path

          inventory_path = Path(os.environ['INVENTORY'])
          inventory = json.loads(inventory_path.read_text(encoding='utf-8'))
          stale = json.loads(Path('/tmp/stale-branches.json').read_text(encoding='utf-8'))
          current = json.loads(Path('/tmp/post-cleanup-branches.json').read_text(encoding='utf-8'))
          deleted_by_name = {entry['branch']: entry['sha'] for entry in stale}
          current_by_name = {entry['branch']: entry['sha'] for entry in current}

          for entry in inventory.get('branches', []):
              branch = entry['branch']
              if branch in current_by_name:
                  entry['postCleanupStatus'] = 'preserved'
                  entry['postCleanupSha'] = current_by_name[branch]
              elif entry.get('decision') == 'delete-after-archive':
                  entry['postCleanupStatus'] = 'deleted-after-archive'
              else:
                  entry['postCleanupStatus'] = 'not-present-at-finalization'

          inventory['finalization'] = {
              'completedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'finalizationInputHead': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'archiveBranch': os.environ['ARCHIVE_BRANCH'],
              'archiveTipAfterFinalAnchoring': os.environ['ARCHIVE_TIP'],
              'additionalDeletedBranches': [
                  {'branch': branch, 'finalShaBeforeCleanup': sha}
                  for branch, sha in sorted(deleted_by_name.items())
              ],
              'remainingBranchesBeforeMerge': current,
              'activePullRequestBranch': os.environ['ACTIVE_BRANCH'],
              'activeBranchDisposition': 'retained only until PR #84 is merged; then delete without rewriting commits',
              'v0.8.0ResolvedCommitBeforeAndAfter': Path('/tmp/v080-before.txt').read_text().strip(),
          }
          inventory['summaryAfterPreMergeCleanup'] = {
              'remoteBranches': len(current),
              'main': 'main' in current_by_name,
              'ghPages': 'gh-pages' in current_by_name,
              'archiveBranches': sum(1 for branch in current_by_name if branch.startswith('archive/')),
              'activeCurationBranch': os.environ['ACTIVE_BRANCH'] in current_by_name,
              'otherBranches': sorted(
                  branch for branch in current_by_name
                  if branch not in {'main', 'gh-pages', os.environ['ACTIVE_BRANCH']}
                  and not branch.startswith('archive/')
              ),
          }
          inventory['cleanupStatus'] = 'complete-before-merge-except-active-pr-branch'
          inventory_path.write_text(json.dumps(inventory, indent=2) + '\n', encoding='utf-8')
          PY
          git diff --check

      - name: Remove both one-time cleanup controllers
        run: |
          rm -f .github/workflows/v081-branch-cleanup-once.yml
          rm -f .github/workflows/v081-finish-branch-cleanup-once.yml

      - name: Commit the verified pre-merge cleanup record once
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: finalize archived branch cleanup before v0.8.1 merge"
          git push origin HEAD:release/v0.8.1-curation
