name: Complete v0.8.1 branch cleanup once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  complete:
    if: github.event.pull_request.number == 84 && github.event.pull_request.head.ref == 'release/v0.8.1-curation'
    runs-on: ubuntu-latest
    env:
      ACTIVE_BRANCH: release/v0.8.1-curation
      ARCHIVE_BRANCH: archive/pre-v0.8.1-branch-tips
      INVENTORY: docs/archive/BRANCH-CLEANUP-INVENTORY-v0.8.1.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact curation branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.8.1-curation
          fetch-depth: 0

      - name: Fetch and classify current refs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --tags origin
          test -f "$INVENTORY"
          git rev-parse 'refs/tags/v0.8.0^{commit}' > /tmp/v080-before.txt

          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          active = os.environ['ACTIVE_BRANCH']
          archive = os.environ['ARCHIVE_BRANCH']

          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/pulls?state=open&per_page=100',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'AQP-v0.8.1-branch-cleanup',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              open_heads = {pull['head']['ref'] for pull in json.load(response)}

          output = subprocess.check_output(
              ['git', 'for-each-ref', '--format=%(refname:short)%00%(objectname)', 'refs/remotes/origin/'],
              text=True,
          )
          heads = []
          for line in output.splitlines():
              if not line.strip():
                  continue
              ref, sha = line.split('\0', 1)
              if ref in {'origin', 'origin/HEAD'}:
                  continue
              branch = ref.removeprefix('origin/')
              heads.append({'branch': branch, 'sha': sha})

          def keep(branch: str) -> bool:
              return (
                  branch in {'main', 'gh-pages', active, archive}
                  or branch.startswith('archive/')
                  or branch in open_heads
              )

          stale = sorted((entry for entry in heads if not keep(entry['branch'])), key=lambda item: item['branch'])
          preserved = sorted((entry for entry in heads if keep(entry['branch'])), key=lambda item: item['branch'])
          Path('/tmp/stale.json').write_text(json.dumps(stale, indent=2) + '\n', encoding='utf-8')
          Path('/tmp/preserved-before.json').write_text(json.dumps(preserved, indent=2) + '\n', encoding='utf-8')

          print(f'Live branches before completion: {len(heads)}')
          for entry in stale:
              print(f"DELETE AFTER ARCHIVE {entry['branch']} {entry['sha']}")
          for entry in preserved:
              print(f"PRESERVE             {entry['branch']} {entry['sha']}")
          PY

      - name: Anchor every remaining stale tip and delete only those refs
        id: cleanup
        run: |
          archive_tip="$(git rev-parse "refs/remotes/origin/$ARCHIVE_BRANCH")"
          archive_tree="$(git rev-parse "$archive_tip^{tree}")"

          while IFS=$'\t' read -r branch sha; do
            [ -n "$branch" ] || continue
            if ! git merge-base --is-ancestor "$sha" "$archive_tip"; then
              archive_tip="$(printf 'Provenance anchor only: %s at %s. This does not merge its file tree into the release.\n' "$branch" "$sha" | git commit-tree "$archive_tree" -p "$archive_tip" -p "$sha")"
            fi
          done < <(jq -r '.[] | [.branch, .sha] | @tsv' /tmp/stale.json)

          git push origin "$archive_tip:refs/heads/$ARCHIVE_BRANCH"

          while IFS=$'\t' read -r branch sha; do
            [ -n "$branch" ] || continue
            git merge-base --is-ancestor "$sha" "$archive_tip"
            case "$branch" in
              main|gh-pages|release/v0.8.1-curation|archive/*)
                echo "Refusing to delete protected branch: $branch" >&2
                exit 1
                ;;
            esac
            git push origin --delete "$branch"
          done < <(jq -r '.[] | [.branch, .sha] | @tsv' /tmp/stale.json)

          echo "archive_tip=$archive_tip" >> "$GITHUB_OUTPUT"

      - name: Verify live branches, archive ancestry and immutable tags
        env:
          ARCHIVE_TIP: ${{ steps.cleanup.outputs.archive_tip }}
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --tags origin
          test "$(git rev-parse 'refs/tags/v0.8.0^{commit}')" = "$(cat /tmp/v080-before.txt)"

          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          active = os.environ['ACTIVE_BRANCH']
          archive = os.environ['ARCHIVE_BRANCH']
          output = subprocess.check_output(
              ['git', 'for-each-ref', '--format=%(refname:short)%00%(objectname)', 'refs/remotes/origin/'],
              text=True,
          )
          live = {}
          for line in output.splitlines():
              if not line.strip():
                  continue
              ref, sha = line.split('\0', 1)
              if ref in {'origin', 'origin/HEAD'}:
                  continue
              live[ref.removeprefix('origin/')] = sha

          unexpected = sorted(
              branch for branch in live
              if not (
                  branch in {'main', 'gh-pages', active, archive}
                  or branch.startswith('archive/')
              )
          )
          required = {'main', 'gh-pages', active, archive}
          missing = sorted(required - set(live))
          if unexpected or missing:
              raise SystemExit(f'Unexpected post-cleanup refs: extra={unexpected}, missing={missing}')

          stale = json.loads(Path('/tmp/stale.json').read_text(encoding='utf-8'))
          for entry in stale:
              if entry['branch'] in live:
                  raise SystemExit(f"Deleted ref remains: {entry['branch']}")

          Path('/tmp/live-after.json').write_text(
              json.dumps([{'branch': name, 'sha': sha} for name, sha in sorted(live.items())], indent=2) + '\n',
              encoding='utf-8',
          )
          print('Verified post-cleanup branch set:')
          for name, sha in sorted(live.items()):
              print(name, sha)
          PY

          python - <<'PY' > /tmp/all-deleted-shas.txt
          import json
          import os
          from pathlib import Path

          inventory = json.loads(Path(os.environ['INVENTORY']).read_text(encoding='utf-8'))
          for entry in inventory.get('branches', []):
              sha = entry.get('finalShaBeforeCleanup') or entry.get('finalShaBeforeDeletion')
              if entry.get('decision') in {'delete-after-archive', 'deleted-ref'} and sha:
                  print(sha)
          for entry in json.loads(Path('/tmp/stale.json').read_text(encoding='utf-8')):
              print(entry['sha'])
          PY
          sort -u /tmp/all-deleted-shas.txt -o /tmp/all-deleted-shas.txt
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue
            git merge-base --is-ancestor "$sha" "$ARCHIVE_TIP"
          done < /tmp/all-deleted-shas.txt

      - name: Write the final pre-merge branch ledger
        env:
          ARCHIVE_TIP: ${{ steps.cleanup.outputs.archive_tip }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          import subprocess
          from pathlib import Path

          inventory_path = Path(os.environ['INVENTORY'])
          inventory = json.loads(inventory_path.read_text(encoding='utf-8'))
          stale = json.loads(Path('/tmp/stale.json').read_text(encoding='utf-8'))
          live = json.loads(Path('/tmp/live-after.json').read_text(encoding='utf-8'))
          live_map = {entry['branch']: entry['sha'] for entry in live}
          known = {entry['branch'] for entry in inventory.get('branches', [])}

          for entry in inventory.get('branches', []):
              branch = entry['branch']
              if branch in live_map:
                  entry['postCleanupStatus'] = 'preserved'
                  entry['postCleanupSha'] = live_map[branch]
              elif entry.get('decision') in {'delete-after-archive', 'deleted-ref'}:
                  entry['postCleanupStatus'] = 'deleted-after-archive'

          for entry in stale:
              if entry['branch'] not in known:
                  inventory.setdefault('branches', []).append({
                      'branch': entry['branch'],
                      'finalShaBeforeCleanup': entry['sha'],
                      'decision': 'delete-after-archive',
                      'reason': 'superseded branch discovered during final live-ref verification',
                      'relatedPullRequests': [],
                      'postCleanupStatus': 'deleted-after-archive',
                  })

          inventory['finalization'] = {
              'completedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'inputHead': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'archiveBranch': os.environ['ARCHIVE_BRANCH'],
              'archiveTipAfterFinalAnchoring': os.environ['ARCHIVE_TIP'],
              'allDeletedTipsReachableFromArchive': True,
              'v0.8.0ResolvedCommitBeforeAndAfter': Path('/tmp/v080-before.txt').read_text().strip(),
              'remainingBranchesBeforeMerge': live,
              'activePullRequestBranchDisposition': 'retain until PR #84 is merged, then delete the ref without rewriting commits',
          }
          inventory['summaryAfterPreMergeCleanup'] = {
              'remoteBranches': len(live),
              'archiveBranches': sum(1 for entry in live if entry['branch'].startswith('archive/')),
              'nonArchiveCurrentBranches': [
                  entry['branch'] for entry in live if not entry['branch'].startswith('archive/')
              ],
              'additionalRefsDeletedInFinalPass': len(stale),
              'formalTagsMutated': False,
          }
          inventory['cleanupStatus'] = 'complete-before-merge-except-active-pr-branch'
          inventory['branches'] = sorted(inventory.get('branches', []), key=lambda entry: entry['branch'])
          inventory_path.write_text(json.dumps(inventory, indent=2) + '\n', encoding='utf-8')
          PY
          git diff --check

      - name: Remove this one-time controller and commit the verified ledger
        run: |
          rm .github/workflows/v081-complete-branch-cleanup-once.yml
          git add -A
          git diff --cached --check
          git commit -m "docs: complete archived branch cleanup before v0.8.1 merge"
          git push origin HEAD:release/v0.8.1-curation
