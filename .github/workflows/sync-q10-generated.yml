name: Sync q10 generated release

on:
  push:
    branches:
      - fix/a27-preserve-recovery-state-q10

permissions:
  contents: write

jobs:
  sync-generated:
    runs-on: ubuntu-latest
    steps:
      - name: Check out q10 branch
        uses: actions/checkout@v4
        with:
          ref: fix/a27-preserve-recovery-state-q10
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: Rebuild committed release outputs
        working-directory: source
        run: npm run build:release

      - name: Commit generated q10 release outputs if needed
        run: |
          git add \
            source/demo/accessible-nasa-tlx-v0.7.html \
            source/demo/accessible-questionnaire-platform-v0.8.html \
            index.html study.html assets questionnaires
          if git diff --cached --quiet; then
            echo "Generated release outputs are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "A27 q10: synchronize generated release outputs"
          git push origin HEAD:fix/a27-preserve-recovery-state-q10
