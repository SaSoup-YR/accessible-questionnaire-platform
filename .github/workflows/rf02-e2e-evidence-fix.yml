name: One-shot RF-02 e2e and evidence repair

on:
  push:
    branches:
      - fix/rf02-truthful-qualtrics-state

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out RF-02 branch
        uses: actions/checkout@v4
        with:
          ref: fix/rf02-truthful-qualtrics-state
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Apply narrow RF-02 follow-up
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')
              print(f'{path}: replaced {count} occurrence(s)')

          # P1: align the rendered-browser fixture with the RF-02 state rename and wording.
          e2e = 'source/tests/e2e/browser-accessibility.spec.ts'
          replace(e2e, 'completionSavedByHost: true', 'completionStagedByBridge: true')
          replace(
              e2e,
              "Qualtrics has not confirmed a recorded response",
              "Qualtrics did not confirm this response",
          )
          # Keep the existing H2 "Submitting response". The staged-state H3 already says
          # "Waiting for Qualtrics"; making both headings identical creates duplicate heading
          # names and is less clear for assistive-technology navigation.
          marker = "  await expect(page.getByRole('heading', { name: 'Waiting for Qualtrics', exact: true })).toBeVisible();\n"
          body_assertion = (
              "  await expect(page.locator('.save-status')).toContainText(\n"
              "    'The survey page received the response data. Keep this page open while Qualtrics continues.',\n"
              "  );\n"
          )
          p = Path(e2e)
          text = p.read_text(encoding='utf-8')
          if body_assertion not in text:
              if marker not in text:
                  raise SystemExit('Could not locate staged-state heading assertion for body assertion')
              text = text.replace(marker, marker + body_assertion, 1)
              p.write_text(text, encoding='utf-8')
              print(f'{e2e}: added truthful staged-body assertion')

          # P2: separate immutable historical q8 evidence from the current q9 candidate.
          p = Path('BUILD-INFO.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['releaseStatus'] = (
              'Draft-PR RF-02 correction candidate. The q9 one-shot unit/build gate passed, '
              'but the repository pull-request verification gate must pass before merge; this is '
              'not a final release evidence point until main/deployment, synthetic Qualtrics and '
              'post-fix manual/AT gates pass.'
          )
          data['builtAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')

          historical = data.pop('verification', data.get('historicalQ8Verification', {}))
          historical['evidenceBuild'] = '0.8.8-q8'
          historical['evidenceRun'] = 31339674025
          historical['interpretation'] = (
              'Historical PR evidence only. These counts and browser checks belong to the q8 '
              'candidate identified by run 31339674025 and must not be read as verification of q9.'
          )
          data['historicalQ8Verification'] = historical

          historical_pr = data.pop('prCiEvidence', data.get('historicalQ8PrCiEvidence', {}))
          historical_pr['evidenceBuild'] = '0.8.8-q8'
          data['historicalQ8PrCiEvidence'] = historical_pr

          data['evaluationStatus'] = (
              'Historical q8 PR CI evidence: run 31339674025 passed the documented unit/component/'
              'technical/release-policy, rendered-browser and cross-browser checks for functional '
              'head 882bd5ce0007e89f40fd42762338abea4714a7ca (tested PR merge revision '
              'c8eb9ddd9b1ca65614442756663c58efec48b630). That run belongs to bridge '
              '0.8.8-q8 and is not evidence for q9. The current RF-02 candidate uses bridge '
              '0.8.9-q9 and requires its own full pull-request gate plus post-fix Qualtrics and '
              'manual/AT retests. No respondent data are collected by the core evaluation, and '
              'none of these checks establish disabled-user benefit, complete WCAG conformance, '
              'psychometric equivalence, multilingual label recognition or permission to recruit.'
          )
          data['rf02CandidateStatus'] = {
              'bridgeBuild': '0.8.9-q9',
              'scope': 'RF-02 / A27 truthful pre-confirmation submission state only',
              'unitAndBuildGate': (
                  'GitHub Actions run 31961904646 passed 208/208 Vitest tests and release build/'
                  'synchronisation; that run did not include the Playwright rendered-browser gate.'
              ),
              'firstPullRequestGate': (
                  'GitHub Actions run 31962088241 failed in Playwright because the e2e fixture and '
                  'expected wording still used pre-RF-02 names.'
              ),
              'followUpAttempt': (
                  'GitHub Actions run 31965045942 fixed the stale property and failure heading, but '
                  'an optional duplicate Waiting for Qualtrics H2/H3 wording change caused a strict '
                  'heading-locator failure; that optional H2 change was not retained.'
              ),
              'requiredBeforeMerge': 'A new full pull-request verification run must pass.',
              'postFixA27Evidence': 'Pending deployment, q9 Qualtrics installation and frozen-route retest.'
          }
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print('BUILD-INFO.json: separated historical q8 evidence from current q9 candidate status')
          PY

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: Run unit and component tests
        working-directory: source
        run: npm test -- --run

      - name: Build for rendered checks
        working-directory: source
        run: npm run build

      - name: Install browser engines
        working-directory: source
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run real-browser accessibility regression
        working-directory: source
        run: npm run test:browser

      - name: Run cross-browser support matrix
        working-directory: source
        run: npm run test:browser-support

      - name: Build and synchronize release outputs
        working-directory: source
        run: npm run build:release

      - name: Guard RF-02 wording, q9 markers and scope
        run: |
          grep -RIn "0.8.9-q9" source/src/result-sink.ts integrations/qualtrics/qualtrics-question.js integrations/qualtrics/question-html-template.html BUILD-INFO.json
          if grep -RIn "Your responses have been recorded" source/src integrations/qualtrics/qualtrics-question.js; then
            echo 'Unexpected pre-confirmation positive recorded claim remains.' >&2
            exit 1
          fi
          if grep -RIn "completionSavedByHost\|Qualtrics has not confirmed a recorded response" source/tests/e2e/browser-accessibility.spec.ts source/src/accessible-nasa-tlx.ts; then
            echo 'Stale RF-02 state name or wording remains.' >&2
            exit 1
          fi
          grep -n "Waiting for Qualtrics" source/src/accessible-nasa-tlx.ts source/tests/e2e/browser-accessibility.spec.ts
          git diff --check

      - name: Commit follow-up and remove one-shot workflow
        run: |
          rm .github/workflows/rf02-e2e-evidence-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "RF-02: sync rendered regression and separate q8/q9 evidence"
          git push origin HEAD:fix/rf02-truthful-qualtrics-state
