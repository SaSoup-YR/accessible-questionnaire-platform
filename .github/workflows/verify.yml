name: Temporary sync RF-06 production announcer preview

on:
  pull_request:

permissions:
  contents: write

env:
  AQP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  AQP_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}

jobs:
  sync-and-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: Verify the production-announcer candidate
        working-directory: source
        run: npm test -- --run

      - name: Generate production, standalone and release outputs
        working-directory: source
        run: npm run build:release

      - name: Restore the canonical workflow and commit generated output
        run: |
          git show "$AQP_BASE_SHA:.github/workflows/verify.yml" > .github/workflows/verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            source/demo/accessible-nasa-tlx-v0.7.html \
            source/demo/accessible-questionnaire-platform-v0.8.html \
            index.html \
            study.html \
            assets \
            questionnaires \
            .github/workflows/verify.yml
          if git diff --cached --quiet; then
            echo "Expected generated RF-06 release changes were not produced."
            exit 1
          fi
          git commit -m "Sync RF-06 production announcer release"
          git push origin "HEAD:$AQP_HEAD_BRANCH"
          echo "PREVIEW_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish immutable RF-06 production-announcer preview
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/aqp-gh-pages origin/gh-pages
          rm -rf /tmp/aqp-gh-pages/rf06-announcer-preview
          mkdir -p /tmp/aqp-gh-pages/rf06-announcer-preview
          cp index.html /tmp/aqp-gh-pages/rf06-announcer-preview/index.html
          cp study.html /tmp/aqp-gh-pages/rf06-announcer-preview/study.html
          cp -R assets /tmp/aqp-gh-pages/rf06-announcer-preview/assets
          cp -R questionnaires /tmp/aqp-gh-pages/rf06-announcer-preview/questionnaires
          printf '%s\n' "$PREVIEW_SOURCE_SHA" > /tmp/aqp-gh-pages/rf06-announcer-preview/SOURCE-SHA.txt
          cd /tmp/aqp-gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rf06-announcer-preview
          if git diff --cached --quiet; then
            echo "RF-06 production-announcer preview already current."
            exit 0
          fi
          git commit -m "Publish RF-06 production announcer preview $PREVIEW_SOURCE_SHA"
          git push origin HEAD:gh-pages
