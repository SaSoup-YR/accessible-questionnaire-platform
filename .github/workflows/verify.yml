name: Temporary apply RF-06 A13 alert candidate

on:
  pull_request:

permissions:
  contents: write

env:
  AQP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  AQP_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}

jobs:
  apply-rf06-a13:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Route only no-speech recovery through a pre-existing alert region
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('source/src/rf06-speech-lifecycle.ts')
          source = source_path.read_text()

          replacements = [
              (
                  "  __rf06VoiceNoticeTimerId?: number | null;\n};",
                  "  __rf06VoiceNoticeTimerId?: number | null;\n  __rf06MessageChannel?: 'status' | 'alert';\n};",
              ),
              (
                  "  clearTimer(component, '__rf06ListeningAnnouncementTimerId');\n  // Safari/VoiceOver",
                  "  clearTimer(component, '__rf06ListeningAnnouncementTimerId');\n  component.__rf06MessageChannel = 'status';\n  // Safari/VoiceOver",
              ),
              (
                  "  clearTimer(component, '__rf06VoiceNoticeTimerId');\n  // Separate the AQP recovery message",
                  "  clearTimer(component, '__rf06VoiceNoticeTimerId');\n  component.__rf06MessageChannel = 'alert';\n  // Separate the AQP recovery message",
              ),
              (
                  "  component.pendingVoiceAnswer = null;\n  component.showVoiceNotice(MANUAL_STOP_MESSAGE);",
                  "  component.pendingVoiceAnswer = null;\n  component.__rf06MessageChannel = 'status';\n  component.showVoiceNotice(MANUAL_STOP_MESSAGE);",
              ),
              (
                  "        : `Say “${first.name}” or “${second!.name}”.`;\n\n    return html`",
                  "        : `Say “${first.name}” or “${second!.name}”.`;\n    const voiceMessageIsAlert =\n      this.__rf06MessageChannel === 'alert' && Boolean(this.voiceMessage);\n\n    return html`",
              ),
              (
                  "          <p class=\"voice-status\" role=\"status\" aria-live=\"polite\" aria-atomic=\"true\">${this.voiceMessage}</p>",
                  "          <p class=\"voice-status\" role=\"status\" aria-live=\"polite\" aria-atomic=\"true\">\n            ${voiceMessageIsAlert ? '' : this.voiceMessage}\n          </p>\n          <p class=\"voice-alert\" role=\"alert\" aria-atomic=\"true\">\n            ${voiceMessageIsAlert ? this.voiceMessage : ''}\n          </p>",
              ),
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'missing RF-06 source replacement: {old[:80]!r}')
              source = source.replace(old, new, 1)

          source_path.write_text(source)

          test_path = Path('source/tests/rf06-speech-lifecycle.test.ts')
          tests = test_path.read_text()

          old = "    expect(status).not.toBeNull();\n    expect(status?.textContent?.trim()).toBe('');"
          new = "    expect(status).not.toBeNull();\n    expect(status?.textContent?.trim()).toBe('');\n    const alert = component.querySelector<HTMLElement>('.voice-alert');\n    expect(alert).not.toBeNull();\n    expect(alert?.getAttribute('role')).toBe('alert');\n    expect(alert?.textContent?.trim()).toBe('');"
          if old not in tests:
              raise SystemExit('missing initial live-region assertion')
          tests = tests.replace(old, new, 1)

          old = "    expect(component.querySelector('.voice-status')?.textContent).toContain('No answer was changed.');\n    expect(component.querySelectorAll<HTMLInputElement>('.rating-option input:checked')).toHaveLength(0);"
          new = "    expect(component.querySelector('.voice-status')?.textContent).toContain('No answer was changed.');\n    expect(component.querySelector('.voice-alert')?.textContent?.trim()).toBe('');\n    expect(component.querySelectorAll<HTMLInputElement>('.rating-option input:checked')).toHaveLength(0);"
          if old not in tests:
              raise SystemExit('missing manual-stop assertion')
          tests = tests.replace(old, new, 1)

          old = "const message = component.querySelector('.voice-status')?.textContent ?? '';"
          count = tests.count(old)
          if count != 3:
              raise SystemExit(f'expected 3 no-speech message assertions, found {count}')
          tests = tests.replace(old, "const message = component.querySelector('.voice-alert')?.textContent ?? '';")

          old = "    expect(component.querySelector('.voice-status')?.textContent).toContain('No speech was detected.');"
          if old not in tests:
              raise SystemExit('missing retained no-speech assertion')
          tests = tests.replace(old, "    expect(component.querySelector('.voice-alert')?.textContent).toContain('No speech was detected.');", 1)

          marker = "    expect(message).toContain('No answer was changed.');"
          tests = tests.replace(
              marker,
              marker + "\n    expect(component.querySelector('.voice-status')?.textContent?.trim()).toBe('');",
          )

          test_path.write_text(tests)
          PY

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: Run RF-06 and repository tests
        working-directory: source
        run: npm test -- --run

      - name: Generate production, standalone and release outputs
        working-directory: source
        run: npm run build:release

      - name: Restore canonical workflow and commit candidate
        run: |
          git show "$AQP_BASE_SHA:.github/workflows/verify.yml" > .github/workflows/verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            source/src/rf06-speech-lifecycle.ts \
            source/tests/rf06-speech-lifecycle.test.ts \
            source/demo/accessible-nasa-tlx-v0.7.html \
            source/demo/accessible-questionnaire-platform-v0.8.html \
            index.html \
            study.html \
            assets \
            questionnaires \
            .github/workflows/verify.yml
          git commit -m "Route RF-06 no-speech recovery through alert"
          git push origin "HEAD:$AQP_HEAD_BRANCH"

      - name: Publish immutable RF-06 A13 preview
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          git fetch origin gh-pages
          git worktree add /tmp/aqp-gh-pages origin/gh-pages
          mkdir -p /tmp/aqp-gh-pages/rf06-a13-preview
          cp source/demo/accessible-questionnaire-platform-v0.8.html /tmp/aqp-gh-pages/rf06-a13-preview/index.html
          printf '%s\n' "$SOURCE_SHA" > /tmp/aqp-gh-pages/rf06-a13-preview/SOURCE-SHA.txt
          cd /tmp/aqp-gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rf06-a13-preview
          git commit -m "Publish RF-06 A13 preview $SOURCE_SHA"
          git push origin HEAD:gh-pages
