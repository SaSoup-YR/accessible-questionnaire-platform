name: Build exact RF-01 synchronized candidate

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Apply bounded candidate patch
        run: python ../scripts/rf01-build-candidate.py

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test -- --run

      - name: Build production site
        run: npm run build

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run rendered-browser accessibility regression
        run: npm run test:browser

      - name: Record cross-browser support
        run: npm run test:browser-support

      - name: Build release outputs
        run: npm run build:release

      - name: Restore canonical workflow and remove bootstrap script in candidate tree
        run: |
          git show b173707024bf4b3b6caa7ddfa99357571d571190:.github/workflows/verify.yml > ../.github/workflows/verify.yml
          rm ../scripts/rf01-build-candidate.py

      - name: Check patch formatting
        run: git diff --check

      - name: Publish exact synchronized candidate
        uses: actions/upload-artifact@v4
        with:
          name: rf01-synchronized-candidate
          path: |
            .github/workflows/verify.yml
            integrations/qualtrics/qualtrics-question.js
            source/tests/rf01-qualtrics-connection-alert.test.ts
            docs/evidence/RF01-R3-A26-DEDICATED-ANNOUNCER-SUCCESSOR-2026-08-21.md
            source/demo/accessible-nasa-tlx-v0.7.html
            source/demo/accessible-questionnaire-platform-v0.8.html
            index.html
            study.html
            assets
            questionnaires
          if-no-files-found: error
          retention-days: 7
