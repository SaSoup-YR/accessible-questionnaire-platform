name: Temporary finalize RF-06 retained runtime

on:
  pull_request:

permissions:
  contents: write

env:
  AQP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  AQP_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}

jobs:
  finalize-rf06:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Remove unproven Voice Access transcript workaround
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('source/src/rf06-speech-lifecycle.ts')
          text = path.read_text()

          text, count_helpers = re.subn(
              r"\nfunction normaliseVoiceControlCommand\(value: string\) \{.*?\n\}\n\nfunction resultTranscripts\(event: RecognitionEventLike\) \{.*?\n\}\n\nfunction isStopVoiceControlCommand\(transcript: string\) \{.*?\n\}\n",
              "\n",
              text,
              count=1,
              flags=re.S,
          )

          text, count_wrapper = re.subn(
              r"\n    const originalOnResult = recognition\.onresult;\n    recognition\.onresult = \(event\) => \{.*?\n    \};\n\n    const originalOnError = recognition\.onerror;",
              "\n    const originalOnError = recognition.onerror;",
              text,
              count=1,
              flags=re.S,
          )

          if count_helpers != 1 or count_wrapper != 1:
              raise SystemExit(f'Unexpected RF-06 patch counts: helpers={count_helpers}, wrapper={count_wrapper}')

          path.write_text(text)
          PY

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: Run RF-06 and repository tests
        working-directory: source
        run: npm test -- --run

      - name: Generate release outputs
        working-directory: source
        run: npm run build:release

      - name: Restore canonical workflow and commit retained runtime
        run: |
          git show "$AQP_BASE_SHA:.github/workflows/verify.yml" > .github/workflows/verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            source/src/rf06-speech-lifecycle.ts \
            source/tests/rf06-speech-lifecycle.test.ts \
            source/demo/accessible-nasa-tlx-v0.7.html \
            source/demo/accessible-questionnaire-platform-v0.8.html \
            index.html \
            study.html \
            assets \
            questionnaires \
            .github/workflows/verify.yml
          if git diff --cached --quiet; then
            echo "No retained RF-06 changes to commit."
            exit 1
          fi
          git commit -m "Retain Safari RF-06 repair and document Voice Access limitation"
          git push origin "HEAD:$AQP_HEAD_BRANCH"
