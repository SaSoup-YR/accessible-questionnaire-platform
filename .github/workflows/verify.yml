name: Temporary sync RF-01 generated release

on:
  pull_request:

permissions:
  contents: write

env:
  AQP_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  AQP_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  sync-generated-release:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: Generate production, standalone and release outputs
        working-directory: source
        run: npm run build:release

      - name: Restore the canonical verification workflow and commit only generated release output
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$AQP_BASE_SHA"
          git show "$AQP_BASE_SHA:.github/workflows/verify.yml" > .github/workflows/verify.yml
          git add -A -- \
            .github/workflows/verify.yml \
            source/demo/accessible-nasa-tlx-v0.7.html \
            source/demo/accessible-questionnaire-platform-v0.8.html \
            index.html \
            study.html \
            assets \
            questionnaires
          if git diff --cached --quiet; then
            echo "Generated release output is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync RF-01 live-status release assets"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
