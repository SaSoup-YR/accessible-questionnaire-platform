name: Commit exact synchronized RF-01 candidate

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fix-rf01-r3-a26-dedicated-announcer

permissions:
  contents: write

jobs:
  commit-candidate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Apply bounded candidate patch
        run: python ../scripts/rf01-build-candidate.py

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test -- --run

      - name: Build production site
        run: npm run build

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run rendered-browser accessibility regression
        run: npm run test:browser

      - name: Record cross-browser support
        run: npm run test:browser-support

      - name: Build release outputs
        run: npm run build:release

      - name: Remove one-shot builder and check formatting
        run: |
          rm ../scripts/rf01-build-candidate.py
          git diff --check

      - name: Commit verified source and generated outputs
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            ../integrations/qualtrics/qualtrics-question.js \
            tests/rf01-qualtrics-connection-alert.test.ts \
            ../docs/evidence/RF01-R3-A26-DEDICATED-ANNOUNCER-SUCCESSOR-2026-08-21.md \
            demo/accessible-nasa-tlx-v0.7.html \
            demo/accessible-questionnaire-platform-v0.8.html \
            ../index.html \
            ../study.html \
            ../assets \
            ../questionnaires \
            ../scripts/rf01-build-candidate.py
          if git diff --cached --quiet; then
            echo "Candidate outputs are already committed."
            exit 0
          fi
          git commit -m "fix: harden RF-01 dedicated connection announcer"
          git push origin HEAD:"$HEAD_BRANCH"
