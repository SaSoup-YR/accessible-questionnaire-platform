name: Verify source and generated release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  AQP_WORKFLOW_EVENT: ${{ github.event_name }}
  AQP_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  AQP_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

jobs:
  rf03-repair:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/fix-rf03-stable-failure-recovery'
    runs-on: ubuntu-latest
    steps:
      - name: Check out RF-03 head branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-rf03-stable-failure-recovery
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Apply bounded RF-03 repair and regression updates
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {label} replacement, found {count}: {old[:100]!r}')
              return text.replace(old, new, 1)

          component_path = Path('source/src/accessible-nasa-tlx.ts')
          text = component_path.read_text()
          replacements = [
          (
          """  @state() private remoteRecordingUnconfirmed = false;\n  @state() private hostSubmissionFailed = false;\n  @state() private submittingResult = false;""",
          """  @state() private remoteRecordingUnconfirmed = false;\n  @state() private hostSubmissionFailed = false;\n  @state() private browserStorageFailed = false;\n  @state() private submittingResult = false;"""
          ),
          (
          """        ${this.hostSubmissionFailed && this.submittedRecord\n          ? html`\n              <section class=\"submission-recovery\" aria-labelledby=\"submission-recovery-heading\">\n                <h3 id=\"submission-recovery-heading\">The study platform has not confirmed this response</h3>\n                <p>\n                  Your answers remain available on this page. You can retry submission, return to an answer,\n                  or save a backup now.\n                </p>\n                ${this.completionSavedLocally\n                  ? html`<p>A complete backup is also stored in this browser on this device.</p>`\n                  : html`<p>\n                      This browser could not store a backup. Download JSON or CSV before leaving this page.\n                    </p>`}\n                <div class=\"button-row compact\">\n                  <button class=\"secondary-button large-answer-button\" type=\"button\" @click=${this.downloadResultJson}>\n                    Download JSON backup\n                  </button>\n                  <button class=\"secondary-button large-answer-button\" type=\"button\" @click=${this.downloadResultCsv}>\n                    Download CSV backup\n                  </button>\n                </div>\n              </section>\n            `\n          : nothing}""",
          """        ${(this.hostSubmissionFailed || this.browserStorageFailed) && this.submittedRecord\n          ? html`\n              <section class=\"submission-recovery\" aria-labelledby=\"submission-recovery-heading\">\n                <h3 id=\"submission-recovery-heading\">\n                  ${this.browserStorageFailed\n                    ? 'The browser could not save the completed record'\n                    : 'The study platform has not confirmed this response'}\n                </h3>\n                <p>\n                  ${this.browserStorageFailed\n                    ? 'The study platform has not been contacted. Your answers remain reviewable on this page. Retry saving, change an answer, or download a backup before leaving.'\n                    : 'Your answers remain reviewable on this page. Retry submission, change an answer, or download a backup before leaving.'}\n                </p>\n                ${this.completionSavedLocally\n                  ? html`<p>A complete backup is also stored in this browser on this device.</p>`\n                  : html`<p>\n                      This browser could not store a completed backup. Download JSON or CSV before leaving this page.\n                    </p>`}\n                <div class=\"button-row compact\">\n                  <button class=\"secondary-button large-answer-button\" type=\"button\" @click=${this.downloadResultJson}>\n                    Download JSON backup\n                  </button>\n                  <button class=\"secondary-button large-answer-button\" type=\"button\" @click=${this.downloadResultCsv}>\n                    Download CSV backup\n                  </button>\n                </div>\n              </section>\n            `\n          : nothing}"""
          ),
          (
          """          <button\n            class=\"primary-button large-answer-button\"\n            type=\"button\"\n            data-gaze-target\n            data-gaze-label=\"Calculate and submit responses\"\n            ?disabled=${this.submittingResult}\n            @click=${this.submitResponses}\n          >\n            ${this.submittingResult ? 'Submitting responses…' : 'Calculate and submit responses'}\n          </button>""",
          """          <button\n            class=\"primary-button large-answer-button\"\n            type=\"button\"\n            data-gaze-target\n            data-gaze-label=${this.browserStorageFailed\n              ? 'Retry saving and submitting responses'\n              : this.hostSubmissionFailed\n              ? 'Retry submission'\n              : 'Calculate and submit responses'}\n            ?disabled=${this.submittingResult}\n            @click=${this.submitResponses}\n          >\n            ${this.submittingResult\n              ? 'Submitting responses…'\n              : this.browserStorageFailed\n              ? 'Retry saving and submitting responses'\n              : this.hostSubmissionFailed\n              ? 'Retry submission'\n              : 'Calculate and submit responses'}\n          </button>"""
          ),
          (
          """      this.completionStagedByBridge = false;\n      this.remoteRecordingUnconfirmed = false;\n      this.hostSubmissionFailed = false;\n      if (sink) {""",
          """      this.completionStagedByBridge = false;\n      this.remoteRecordingUnconfirmed = false;\n      this.hostSubmissionFailed = false;\n      this.browserStorageFailed = false;\n      if (this.studyConfig && !this.completionSavedLocally) {\n        this.browserStorageFailed = true;\n        this.showError(\n          'The browser could not save the completed record. The study platform has not been contacted. Your answers remain reviewable. Retry saving, change an answer, or download a JSON or CSV backup before leaving this page.',\n        );\n        return;\n      }\n      if (sink) {"""
          ),
          (
          """        } catch (error) {\n          this.hostSubmissionFailed = true;\n          const detail = error instanceof Error ? error.message : 'The study platform did not accept the response.';""",
          """        } catch (error) {\n          this.hostSubmissionFailed = true;\n          this.browserStorageFailed = false;\n          const detail = error instanceof Error ? error.message : 'The study platform did not accept the response.';"""
          ),
          (
          """    this.remoteRecordingUnconfirmed = false;\n    this.hostSubmissionFailed = false;\n    this.submittingResult = false;""",
          """    this.remoteRecordingUnconfirmed = false;\n    this.hostSubmissionFailed = false;\n    this.browserStorageFailed = false;\n    this.submittingResult = false;"""
          ),
          (
          """    this.remoteRecordingUnconfirmed = false;\n    this.hostSubmissionFailed = false;\n  }\n\n  private toggleReadAloud""",
          """    this.remoteRecordingUnconfirmed = false;\n    this.hostSubmissionFailed = false;\n    this.browserStorageFailed = false;\n  }\n\n  private toggleReadAloud"""
          )]
          for old, new in replacements:
              text = replace_once(text, old, new, 'component')
          component_path.write_text(text)

          integration_path = Path('integrations/qualtrics/qualtrics-question.js')
          integration = integration_path.read_text()
          old = """      setStatus(\n        detail +\n        ' Return to the questionnaire and try again. If it keeps failing, use the download' +\n        ' button on the questionnaire and tell the study conductor.',\n        false\n      );\n      releaseFullscreenForNativeNavigation();\n      sendStagingReceipt(event.source, false, submissionId || '', detail);\n      // Staging can fail deterministically — an oversized record fails identically on every\n      // retry — so the navigation control is restored. Without it the participant is left on\n      // a page with no way to submit and no way to advance.\n      question.showNextButton();"""
          new = """      setStatus(\n        detail +\n        ' The response was not staged. Keep the questionnaire open and use its Retry, Change, JSON or CSV recovery actions.',\n        false,\n        'error'\n      );\n      // Preserve the live participant iframe and its review/recovery state. Reparenting\n      // the iframe here can recreate its browsing context and replace the actionable\n      // staging failure with a generic saved-session offer.\n      releaseFullscreenForNativeNavigation(true);\n      setImportantStyle(status, 'position', 'sticky');\n      setImportantStyle(status, 'top', '0');\n      setImportantStyle(status, 'z-index', '2147483001');\n      sendStagingReceipt(event.source, false, submissionId || '', detail);\n      // Do not expose native Qualtrics Next as a bypass while staging is unresolved.\n      // The participant can retry from the still-live AQP review screen. A27's\n      // post-staging advance-failure path remains separate and still restores Next."""
          integration = replace_once(integration, old, new, 'Qualtrics staging')
          integration_path.write_text(integration)

          sink_test_path = Path('source/tests/result-sink.test.ts')
          tests = sink_test_path.read_text()
          old = """    expect(runtime.setJSEmbeddedData).not.toHaveBeenCalledWith('AQP_ACCEPTED', '1');\n    expect(runtime.showNextButton).toHaveBeenCalledOnce();\n    expect(runtime.frameWindow.postMessage).toHaveBeenCalledWith("""
          new = """    expect(runtime.setJSEmbeddedData).not.toHaveBeenCalledWith('AQP_ACCEPTED', '1');\n    expect(runtime.showNextButton).not.toHaveBeenCalled();\n    expect(runtime.dom.statusAttributes['data-severity']).toBe('error');\n    expect(runtime.frameWindow.postMessage).toHaveBeenCalledWith("""
          tests = replace_once(tests, old, new, 'invalid-record navigation gate')

          old = """    expect(runtime.setJSEmbeddedData).toHaveBeenCalledWith('AQP_RAW_05', expect.any(String));\n    expect(runtime.setJSEmbeddedData).not.toHaveBeenCalledWith('AQP_ACCEPTED', '1');\n    expect(runtime.showNextButton).toHaveBeenCalledOnce();\n    expect(runtime.dom.status.textContent).toContain('Injected raw-field staging failure');"""
          new = """    expect(runtime.setJSEmbeddedData).toHaveBeenCalledWith('AQP_RAW_05', expect.any(String));\n    expect(runtime.setJSEmbeddedData).not.toHaveBeenCalledWith('AQP_ACCEPTED', '1');\n    expect(runtime.showNextButton).not.toHaveBeenCalled();\n    expect(runtime.dom.status.textContent).toContain('Injected raw-field staging failure');\n    expect(runtime.dom.status.textContent).toContain('Retry, Change, JSON or CSV');\n    expect(runtime.dom.statusAttributes['data-severity']).toBe('error');"""
          tests = replace_once(tests, old, new, 'partial-staging navigation gate')

          old = """  it('restores Qualtrics navigation when an invalid record cannot be staged', () => {"""
          new = """  it('preserves the live participant recovery route and blocks native Next when staging fails', () => {"""
          tests = replace_once(tests, old, new, 'staging policy test title')

          old = """    expect(showNextButton).toHaveBeenCalledOnce();\n    expect(dom.status.textContent).toContain('Return to the questionnaire and try again');\n    expect(dom.bodyStyle.overflow).toBe('');"""
          new = """    expect(showNextButton).not.toHaveBeenCalled();\n    expect(dom.status.textContent).toContain('The response was not staged');\n    expect(dom.status.textContent).toContain('Retry, Change, JSON or CSV');\n    expect(dom.statusAttributes['data-severity']).toBe('error');\n    expect(dom.bodyStyle.overflow).toBe('');"""
          tests = replace_once(tests, old, new, 'live recovery gate')
          sink_test_path.write_text(tests)

          component_test_path = Path('source/tests/study-component.test.ts')
          component_tests = component_test_path.read_text()
          old = """    expect(\n      [...component.querySelectorAll<HTMLButtonElement>('button')]\n        .some((button) => button.textContent?.includes('Calculate and submit')),\n    ).toBe(true);"""
          new = """    expect(\n      [...component.querySelectorAll<HTMLButtonElement>('button')]\n        .some((button) => button.textContent?.trim() === 'Retry submission'),\n    ).toBe(true);\n    expect(\n      [...component.querySelectorAll<HTMLButtonElement>('button')]\n        .some((button) => button.textContent?.includes('Change item 1 answer')),\n    ).toBe(true);"""
          component_tests = replace_once(component_tests, old, new, 'host-failure retry label')

          old = """  it('keeps the in-progress recovery copy and download buttons if localStorage is full', async () => {\n    const component = await renderConfiguredComponent();\n    window.accessibleNasaTlxResultSink = {\n      name: 'UCL approved test platform',\n      async submit(record) {\n        return {\n          accepted: true,\n          submissionId: record.submissionId,\n          receiptId: 'receipt-storage-full',\n        };\n      },\n    };\n    await completeQuestionnaire(component);\n    const progressKey = Object.keys(localStorage).find((key) => key.includes('-progress:'));\n    expect(progressKey).toBeTruthy();\n    const setItem = vi.spyOn(Storage.prototype, 'setItem').mockImplementation(() => {\n      throw new DOMException('Quota exceeded', 'QuotaExceededError');\n    });\n\n    [...component.querySelectorAll<HTMLButtonElement>('button')]\n      .find((button) => button.textContent?.includes('Calculate and submit'))!\n      .click();\n    await new Promise((resolve) => setTimeout(resolve, 0));\n    await component.updateComplete;\n\n    expect(setItem).toHaveBeenCalled();\n    expect(loadCompletedResults()).toEqual([]);\n    expect(component.querySelector('.save-status')?.textContent).toContain(\n      'could not keep a backup copy',\n    );\n    expect(component.textContent).toContain('Download JSON backup');\n    expect(component.textContent).toContain('Download CSV backup');\n    expect(localStorage.getItem(progressKey!)).not.toBeNull();\n  });"""
          new = """  it('keeps review, recovery actions and the in-progress copy if completed-record storage fails', async () => {\n    const component = await renderConfiguredComponent();\n    const submit = vi.fn(async (record: StudyResultRecord) => ({\n      accepted: true as const,\n      submissionId: record.submissionId,\n      receiptId: 'receipt-storage-full',\n    }));\n    window.accessibleNasaTlxResultSink = {\n      name: 'UCL approved test platform',\n      submit,\n    };\n    await completeQuestionnaire(component);\n    const progressKey = Object.keys(localStorage).find((key) => key.includes('-progress:'));\n    expect(progressKey).toBeTruthy();\n    const setItem = vi.spyOn(Storage.prototype, 'setItem').mockImplementation(() => {\n      throw new DOMException('Quota exceeded', 'QuotaExceededError');\n    });\n\n    [...component.querySelectorAll<HTMLButtonElement>('button')]\n      .find((button) => button.textContent?.includes('Calculate and submit'))!\n      .click();\n    await new Promise((resolve) => setTimeout(resolve, 0));\n    await component.updateComplete;\n\n    expect(setItem).toHaveBeenCalled();\n    expect(submit).not.toHaveBeenCalled();\n    expect(loadCompletedResults()).toEqual([]);\n    expect(component.querySelector('#review-heading')).not.toBeNull();\n    expect(component.querySelector('#complete-heading')).toBeNull();\n    expect(component.querySelector('#error-summary')?.textContent).toContain(\n      'The browser could not save the completed record',\n    );\n    expect(component.querySelector('#error-summary')?.textContent).toContain(\n      'study platform has not been contacted',\n    );\n    expect(document.activeElement).toBe(component.querySelector('#error-summary'));\n    expect(component.querySelector('.submission-recovery')?.textContent).toContain(\n      'The browser could not save the completed record',\n    );\n    expect(component.textContent).toContain('Retry saving and submitting responses');\n    expect(component.textContent).toContain('Change item 1 answer');\n    expect(component.textContent).toContain('Download JSON backup');\n    expect(component.textContent).toContain('Download CSV backup');\n    expect(localStorage.getItem(progressKey!)).not.toBeNull();\n\n    setItem.mockRestore();\n    [...component.querySelectorAll<HTMLButtonElement>('button')]\n      .find((button) => button.textContent?.trim() === 'Retry saving and submitting responses')!\n      .click();\n    await new Promise((resolve) => setTimeout(resolve, 0));\n    await component.updateComplete;\n\n    expect(submit).toHaveBeenCalledOnce();\n    expect(component.querySelector('#complete-heading')).not.toBeNull();\n  });"""
          component_tests = replace_once(component_tests, old, new, 'storage-failure recovery test')
          component_test_path.write_text(component_tests)

      - name: Install and verify repair
        working-directory: source
        run: |
          npm ci
          npm test -- --run
          npm run build:release

      - name: Commit repair and restore workflow
        run: |
          rm -f .github/workflows/rf03-patch-and-sync.yml
          git checkout origin/main -- .github/workflows/verify.yml
          git add \
            .github/workflows/verify.yml \
            .github/workflows/rf03-patch-and-sync.yml \
            source/src/accessible-nasa-tlx.ts \
            integrations/qualtrics/qualtrics-question.js \
            source/tests/result-sink.test.ts \
            source/tests/study-component.test.ts \
            source/demo/accessible-questionnaire-platform-v0.8.html \
            source/demo/accessible-nasa-tlx-v0.7.html \
            index.html study.html assets questionnaires
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "repair RF-03 stable sink and storage recovery"
          git push origin HEAD:agent/fix-rf03-stable-failure-recovery

  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test -- --run

      - name: Add quantified technical evaluation to the job summary
        if: always()
        run: npm run report:technical

      - name: Publish quantified technical evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantified-technical-evaluation
          path: |
            docs/evidence/fidelity-source-of-truth.json
            docs/evidence/technical-evaluation-report.json
            docs/evidence/technical-evaluation-report.html
          if-no-files-found: error
          retention-days: 90

      - name: Build the production site for rendered-browser checks
        run: npm run build

      - name: Install browser engines for rendered checks
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run real-browser accessibility regression
        run: npm run test:browser

      - name: Record the cross-browser capability matrix
        if: always()
        run: npm run test:browser-support

      - name: Add the cross-browser matrix to the job summary
        if: always()
        run: npm run report:browser-support

      - name: Add rendered accessibility evidence to the job summary
        if: always()
        run: npm run report:browser

      - name: Publish rendered accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-accessibility-evidence
          path: |
            docs/evidence/axe-browser-report.json
            docs/evidence/axe-browser-report.html
            docs/evidence/cross-browser-support-report.json
            docs/evidence/cross-browser-support-report.html
            source/playwright-report
            source/test-results
          if-no-files-found: error
          retention-days: 90

      - name: Build production, standalone and release outputs
        run: npm run build:release

      - name: Confirm the committed deployment files are current
        run: >-
          git diff --exit-code --
          demo/accessible-nasa-tlx-v0.7.html
          demo/accessible-questionnaire-platform-v0.8.html
          ../index.html
          ../study.html
          ../assets
          ../questionnaires

  sync-pages:
    name: Sync verified main to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the deployment branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Replace its file tree with the verified main revision
        env:
          VERIFIED_MAIN_SHA: ${{ github.sha }}
        run: |
          git fetch origin "$VERIFIED_MAIN_SHA"
          git read-tree --reset -u "$VERIFIED_MAIN_SHA"
          if git diff --cached --quiet; then
            echo "GitHub Pages already matches verified main."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy verified main ${VERIFIED_MAIN_SHA}"
          git push origin HEAD:gh-pages
