name: Temporary sync RF-06 R4 Escape preview

on:
  pull_request:

permissions:
  contents: write

env:
  AQP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  AQP_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}

jobs:
  sync-and-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: Verify RF-06 Escape candidate
        working-directory: source
        run: npm test -- --run

      - name: Generate production, standalone and release outputs
        working-directory: source
        run: npm run build:release

      - name: Restore canonical workflow and commit generated output
        id: runtime
        run: |
          git show "$AQP_BASE_SHA:.github/workflows/verify.yml" > .github/workflows/verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            source/demo/accessible-nasa-tlx-v0.7.html \
            source/demo/accessible-questionnaire-platform-v0.8.html \
            index.html \
            study.html \
            assets \
            questionnaires \
            .github/workflows/verify.yml
          if git diff --cached --quiet; then
            echo "No generated RF-06 Escape release changes to commit."
            exit 1
          fi
          git commit -m "Sync RF-06 R4 Escape generated release"
          RUNTIME_SHA=$(git rev-parse HEAD)
          echo "runtime_sha=$RUNTIME_SHA" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:$AQP_HEAD_BRANCH"

      - name: Publish immutable RF-06 R4 Escape preview
        env:
          RUNTIME_SHA: ${{ steps.runtime.outputs.runtime_sha }}
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/aqp-gh-pages origin/gh-pages
          mkdir -p /tmp/aqp-gh-pages/rf06-r4-escape-preview
          cp source/demo/accessible-questionnaire-platform-v0.8.html /tmp/aqp-gh-pages/rf06-r4-escape-preview/index.html
          printf '%s\n' "$RUNTIME_SHA" > /tmp/aqp-gh-pages/rf06-r4-escape-preview/SOURCE-SHA.txt
          git -C /tmp/aqp-gh-pages config user.name "github-actions[bot]"
          git -C /tmp/aqp-gh-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/aqp-gh-pages add rf06-r4-escape-preview
          if git -C /tmp/aqp-gh-pages diff --cached --quiet; then
            echo "Preview already matches runtime $RUNTIME_SHA."
            exit 0
          fi
          git -C /tmp/aqp-gh-pages commit -m "Publish RF-06 R4 Escape preview $RUNTIME_SHA"
          git -C /tmp/aqp-gh-pages push origin HEAD:gh-pages
