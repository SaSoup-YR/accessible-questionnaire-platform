name: Temporary sync final RF-06 generated release

on:
  pull_request:

permissions:
  contents: write

env:
  AQP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  AQP_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}

jobs:
  sync-release:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: Verify final retained RF-06 source
        working-directory: source
        run: npm test -- --run

      - name: Generate production, standalone and release outputs
        working-directory: source
        run: npm run build:release

      - name: Restore canonical workflow and commit generated output
        run: |
          git show "$AQP_BASE_SHA:.github/workflows/verify.yml" > .github/workflows/verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            source/demo/accessible-nasa-tlx-v0.7.html \
            source/demo/accessible-questionnaire-platform-v0.8.html \
            index.html \
            study.html \
            assets \
            questionnaires \
            .github/workflows/verify.yml
          if git diff --cached --quiet; then
            echo "No generated RF-06 release changes to commit."
            exit 1
          fi
          git commit -m "Sync final RF-06 generated release"
          git push origin "HEAD:$AQP_HEAD_BRANCH"
