name: Archived branch cleanup controller

# Automatic pull-request triggering is intentionally disabled. The original
# one-time cleanup recorded branch tips and archived every tip before deletion,
# but its pre-deletion inventory push caused repeated PR synchronize events.
# Remaining cleanup is completed from the recorded inventory through a new
# non-recursive controller, then this file is removed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Automatic branch cleanup is disabled."
