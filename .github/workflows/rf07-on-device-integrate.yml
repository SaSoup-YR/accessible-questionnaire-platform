name: One-time RF-07 on-device integration

on:
  pull_request:

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'agent/retry-rf07-on-device-speech'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out the RF-07 successor branch
        uses: actions/checkout@v4
        with:
          ref: agent/retry-rf07-on-device-speech
          fetch-depth: 5

      - name: Apply the bounded component integration
        run: python ../scripts/rf07-on-device-integration.py

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run all unit and component tests
        run: npm test -- --run

      - name: Build and synchronize release outputs
        run: npm run build:release

      - name: Remove one-time integration scaffolding and check formatting
        run: |
          rm ../scripts/rf07-on-device-integration.py
          rm ../.github/workflows/rf07-on-device-integrate.yml
          git diff --check

      - name: Commit the exact tested candidate
        env:
          HEAD_BRANCH: agent/retry-rf07-on-device-speech
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            ../.github/workflows/rf07-on-device-integrate.yml \
            ../scripts/rf07-on-device-integration.py \
            src/accessible-nasa-tlx.ts \
            demo/accessible-nasa-tlx-v0.7.html \
            demo/accessible-questionnaire-platform-v0.8.html \
            ../index.html \
            ../study.html \
            ../assets \
            ../questionnaires
          if git diff --cached --quiet; then
            echo "The on-device candidate is already integrated."
            exit 0
          fi
          git commit -m "feat: prefer bounded on-device command recognition"
          git push origin HEAD:"$HEAD_BRANCH"
