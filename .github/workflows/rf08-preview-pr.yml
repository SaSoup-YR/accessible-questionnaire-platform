name: RF-08 one-time smiley preview publisher

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.number == 78
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact synchronized RF-08 runtime
        uses: actions/checkout@v4
        with:
          ref: f91d74c06bf5a29fde278f167c3a32949f88f3ec
          path: runtime
          fetch-depth: 1

      - name: Check out gh-pages separately
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 1

      - name: Create only the immutable RF-08 preview
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW='pages/rf08-smiley-preview'
          if [ -e "$PREVIEW" ]; then
            echo 'Refusing to overwrite an existing RF-08 preview.' >&2
            exit 1
          fi
          mkdir -p "$PREVIEW"
          cp runtime/source/demo/accessible-questionnaire-platform-v0.8.html "$PREVIEW/index.html"
          printf '%s\n' 'f91d74c06bf5a29fde278f167c3a32949f88f3ec' > "$PREVIEW/SOURCE-SHA.txt"

      - name: Commit and push only the preview directory
        working-directory: pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rf08-smiley-preview
          CHANGED="$(git diff --cached --name-only)"
          printf '%s\n' "$CHANGED"
          test -n "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -v '^rf08-smiley-preview/' | grep -q .; then
            echo 'Unexpected gh-pages path changed; refusing publish.' >&2
            exit 1
          fi
          git commit -m 'Publish immutable RF-08 smiley preview f91d74c0'
          git push origin HEAD:gh-pages
