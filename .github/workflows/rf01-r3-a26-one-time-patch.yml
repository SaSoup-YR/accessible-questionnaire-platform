name: One-time RF-01 R3-A26 dedicated announcer patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/fix-rf01-r3-a26-dedicated-announcer'
    runs-on: ubuntu-latest
    steps:
      - name: Check out successor branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-rf01-r3-a26-dedicated-announcer
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Apply bounded dedicated-announcer change and regression updates
        run: |
          python - <<'PY'
          from pathlib import Path

          bridge_path = Path('integrations/qualtrics/qualtrics-question.js')
          bridge = bridge_path.read_text()

          old_vars = """  var connectionTimerId = null;
            var connectionAnnouncementTimerId = null;
            var parentReadyTimerIds = [];
          """
          new_vars = """  var connectionTimerId = null;
            var connectionAnnouncementTimerId = null;
            var connectionAnnouncer = null;
            var parentReadyTimerIds = [];
          """
          if old_vars in bridge:
              bridge = bridge.replace(old_vars, new_vars, 1)
          elif new_vars not in bridge:
              raise SystemExit('RF-01 variable anchor not found; refusing unbounded patch')

          old_queue = """  function queueConnectingStatus() {
            if (!status) return;
            // WCAG Technique ARIA22 requires the status container to exist with its role
            // before the status message occurs. Qualtrics-generated HTML historically ships
            // initial fallback text in this element, so clear that text first and inject the
            // runtime Connecting message on a later task after the live region is established.
            if (typeof status.setAttribute === 'function') {
              status.setAttribute('role', 'status');
              status.setAttribute('data-quiet', 'false');
              status.setAttribute('data-severity', 'information');
              status.setAttribute('aria-live', 'polite');
              status.setAttribute('aria-atomic', 'true');
            }
            status.textContent = '';
            connectionAnnouncementTimerId = window.setTimeout(function announceConnectingStatus() {
              connectionAnnouncementTimerId = null;
              if (childConnected) return;
              setStatus(
                'Connecting questionnaire package ' + bridgeBuild + ' to this Qualtrics response.',
                false
              );
            }, 50);
          }
          """
          new_queue = """  function ensureConnectionAnnouncer() {
            if (connectionAnnouncer) return connectionAnnouncer;
            if (!document.body || typeof document.createElement !== 'function') return null;

            // This is a scoped version of the persistent fallback architecture used by
            // github/arianotify-polyfill: register one empty polite region in a stable
            // body-level root before the first message, then mutate that region later.
            // Keeping it local avoids monkey-patching the Qualtrics host page or adding
            // an external script/network dependency to the paste-in integration.
            connectionAnnouncer = document.createElement('div');
            connectionAnnouncer.setAttribute('role', 'status');
            connectionAnnouncer.setAttribute('aria-live', 'polite');
            connectionAnnouncer.setAttribute('aria-atomic', 'true');
            connectionAnnouncer.setAttribute('data-aqp-connection-announcer', 'true');
            connectionAnnouncer.textContent = '';
            if (connectionAnnouncer.style) {
              connectionAnnouncer.style.position = 'absolute';
              connectionAnnouncer.style.width = '1px';
              connectionAnnouncer.style.height = '1px';
              connectionAnnouncer.style.margin = '-1px';
              connectionAnnouncer.style.padding = '0';
              connectionAnnouncer.style.border = '0';
              connectionAnnouncer.style.overflow = 'hidden';
              connectionAnnouncer.style.clip = 'rect(0 0 0 0)';
              connectionAnnouncer.style.clipPath = 'inset(50%)';
              connectionAnnouncer.style.whiteSpace = 'nowrap';
            }
            document.body.appendChild(connectionAnnouncer);
            return connectionAnnouncer;
          }

          function announceConnectionStatus(message) {
            var announcer = ensureConnectionAnnouncer();
            if (!announcer) return;
            // Repeated identical live-region text may not emit another event. Match the
            // production polyfill's no-audible-difference mutation strategy.
            announcer.textContent = announcer.textContent === message
              ? message + '\\u00a0'
              : message;
          }

          function removeConnectionAnnouncer() {
            if (!connectionAnnouncer) return;
            if (typeof connectionAnnouncer.remove === 'function') {
              connectionAnnouncer.remove();
            } else if (
              connectionAnnouncer.parentNode &&
              typeof connectionAnnouncer.parentNode.removeChild === 'function'
            ) {
              connectionAnnouncer.parentNode.removeChild(connectionAnnouncer);
            }
            connectionAnnouncer = null;
          }

          function queueConnectingStatus() {
            if (!status) return;
            // The visible status remains programmatically a status and remains available
            // to navigation. Its live behavior is disabled for this advisory transition
            // so the dedicated body-level announcer is the single automatic AT channel.
            if (typeof status.setAttribute === 'function') {
              status.setAttribute('role', 'status');
              status.setAttribute('data-quiet', 'false');
              status.setAttribute('data-severity', 'information');
              status.setAttribute('aria-live', 'off');
              status.setAttribute('aria-atomic', 'true');
            }
            status.textContent = '';
            ensureConnectionAnnouncer();
            connectionAnnouncementTimerId = window.setTimeout(function announceConnectingStatus() {
              connectionAnnouncementTimerId = null;
              if (childConnected) return;
              var message =
                'Connecting questionnaire package ' + bridgeBuild + ' to this Qualtrics response.';
              status.textContent = message;
              announceConnectionStatus(message);
            }, 250);
          }
          """
          if old_queue in bridge:
              bridge = bridge.replace(old_queue, new_queue, 1)
          elif new_queue not in bridge:
              raise SystemExit('RF-01 queueConnectingStatus anchor not found; refusing unbounded patch')

          old_cleanup = """    if (connectionAnnouncementTimerId !== null) {
              window.clearTimeout(connectionAnnouncementTimerId);
              connectionAnnouncementTimerId = null;
            }
            parentReadyTimerIds.forEach(function clearParentReadyTimer(timerId) {
          """
          new_cleanup = """    if (connectionAnnouncementTimerId !== null) {
              window.clearTimeout(connectionAnnouncementTimerId);
              connectionAnnouncementTimerId = null;
            }
            removeConnectionAnnouncer();
            parentReadyTimerIds.forEach(function clearParentReadyTimer(timerId) {
          """
          if old_cleanup in bridge:
              bridge = bridge.replace(old_cleanup, new_cleanup, 1)
          elif new_cleanup not in bridge:
              raise SystemExit('RF-01 unload anchor not found; refusing unbounded patch')

          bridge_path.write_text(bridge)

          test_path = Path('source/tests/rf01-qualtrics-connection-alert.test.ts')
          test = test_path.read_text()

          test = test.replace(
              """  let onReady: (() => void) | undefined;
            let receiveMessage: ((event: MessageEvent) => void) | undefined;
          """,
              """  let onReady: (() => void) | undefined;
            let onUnload: (() => void) | undefined;
            let receiveMessage: ((event: MessageEvent) => void) | undefined;
          """,
              1,
          )

          status_marker = """  const statusAttributes: Record<string, string> = {};
          """
          announcer_setup = """  const statusAttributes: Record<string, string> = {};
            const announcerAttributes: Record<string, string> = {};
            const announcer: any = {
              textContent: '',
              style: {},
              parentNode: null,
              setAttribute(name: string, value: string) {
                announcerAttributes[name] = value;
              },
              remove: vi.fn(function removeAnnouncer() {
                if (announcer.parentNode?.removeChild) announcer.parentNode.removeChild(announcer);
              }),
            };
          """
          if status_marker in test and announcer_setup not in test:
              test = test.replace(status_marker, announcer_setup, 1)

          old_body = """  const body: any = {
              style: bodyStyle.style,
              appendChild(node: any) {
                node.parentNode = body;
              },
            };
            const documentRef = {
              body,
              documentElement: { style: htmlStyle.style },
              getElementById(id: string) {
          """
          new_body = """  const body: any = {
              style: bodyStyle.style,
              children: [] as any[],
              appendChild(node: any) {
                node.parentNode = body;
                if (!body.children.includes(node)) body.children.push(node);
              },
              removeChild(node: any) {
                body.children = body.children.filter((entry: any) => entry !== node);
                node.parentNode = null;
              },
            };
            const documentRef = {
              body,
              documentElement: { style: htmlStyle.style },
              createElement(tagName: string) {
                if (tagName !== 'div') throw new Error(`Unexpected test element ${tagName}`);
                return announcer;
              },
              getElementById(id: string) {
          """
          if old_body in test:
              test = test.replace(old_body, new_body, 1)
          elif new_body not in test:
              raise SystemExit('RF-01 test body/document anchor not found')

          old_unload = """      addOnUnload: vi.fn(),
          """
          new_unload = """      addOnUnload(callback: () => void) {
                onUnload = callback;
              },
          """
          if old_unload in test:
              test = test.replace(old_unload, new_unload, 1)
          elif new_unload not in test:
              raise SystemExit('RF-01 test unload anchor not found')

          old_return = """    status,
              statusAttributes,
              hideNextButton,
          """
          new_return = """    status,
              statusAttributes,
              announcer,
              announcerAttributes,
              hideNextButton,
          """
          if old_return in test:
              test = test.replace(old_return, new_return, 1)
          elif new_return not in test:
              raise SystemExit('RF-01 test return anchor not found')

          old_receive = """    receiveMessage: (event: MessageEvent) => receiveMessage!(event),
            };
          """
          new_receive = """    receiveMessage: (event: MessageEvent) => receiveMessage!(event),
              unload: () => onUnload!(),
            };
          """
          if old_receive in test:
              test = test.replace(old_receive, new_receive, 1)
          elif new_receive not in test:
              raise SystemExit('RF-01 test receive anchor not found')

          test = test.replace(
              "expect(runtime.statusAttributes['aria-live']).toBe('polite');",
              "expect(runtime.statusAttributes['aria-live']).toBe('off');",
              2,
          )
          test = test.replace(
              "runtime.timers.find(({ delay }) => delay === 50)!.callback();",
              "runtime.timers.find(({ delay }) => delay === 250)!.callback();",
          )

          first_initial = """    expect(runtime.statusAttributes['data-severity']).toBe('information');
              expect(runtime.hideNextButton).toHaveBeenCalledOnce();
          """
          first_initial_new = """    expect(runtime.statusAttributes['data-severity']).toBe('information');
              expect(runtime.announcer.textContent).toBe('');
              expect(runtime.announcerAttributes.role).toBe('status');
              expect(runtime.announcerAttributes['aria-live']).toBe('polite');
              expect(runtime.announcerAttributes['aria-atomic']).toBe('true');
              expect(runtime.hideNextButton).toHaveBeenCalledOnce();
          """
          if first_initial in test:
              test = test.replace(first_initial, first_initial_new, 1)

          first_after = """    expect(runtime.status.textContent).toContain('Connecting questionnaire package');
              expect(runtime.statusAttributes.role).toBe('status');
          """
          first_after_new = """    expect(runtime.status.textContent).toContain('Connecting questionnaire package');
              expect(runtime.announcer.textContent).toBe(runtime.status.textContent);
              expect(runtime.statusAttributes.role).toBe('status');
          """
          if first_after in test:
              test = test.replace(first_after, first_after_new, 1)

          second_before_delayed = """    expect(runtime.setJSEmbeddedData).toHaveBeenCalledWith('AQP_BRIDGE_READY', '1');

              runtime.timers.find(({ delay }) => delay === 250)!.callback();

              expect(runtime.status.textContent).toContain('questionnaire is connected');
          """
          second_before_delayed_new = """    expect(runtime.setJSEmbeddedData).toHaveBeenCalledWith('AQP_BRIDGE_READY', '1');
              expect(runtime.announcer.textContent).toBe('');

              runtime.timers.find(({ delay }) => delay === 250)!.callback();

              expect(runtime.status.textContent).toContain('questionnaire is connected');
              expect(runtime.announcer.textContent).toBe('');
          """
          if second_before_delayed in test:
              test = test.replace(second_before_delayed, second_before_delayed_new, 1)

          end_marker = """    expect(runtime.statusAttributes['aria-live']).toBe('off');
            });
          });
          """
          end_new = """    expect(runtime.statusAttributes['aria-live']).toBe('off');
            });

            it('removes the scoped connection announcer on Qualtrics unload', () => {
              const runtime = createRuntime();
              expect(runtime.announcer.parentNode).not.toBeNull();
              runtime.unload();
              expect(runtime.announcer.remove).toHaveBeenCalledOnce();
              expect(runtime.announcer.parentNode).toBeNull();
            });
          });
          """
          if end_marker in test and "removes the scoped connection announcer" not in test:
              test = test.replace(end_marker, end_new, 1)

          test_path.write_text(test)
          PY

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: Run RF-01 targeted regressions
        working-directory: source
        run: npx vitest run tests/rf01-qualtrics-connection-alert.test.ts

      - name: Run full unit/component suite
        working-directory: source
        run: npm test -- --run

      - name: Commit bounded candidate
        run: |
          git add integrations/qualtrics/qualtrics-question.js source/tests/rf01-qualtrics-connection-alert.test.ts
          if git diff --cached --quiet; then
            echo "Dedicated-announcer candidate is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add dedicated R3-A26 connection announcer"
          git push origin HEAD:agent/fix-rf01-r3-a26-dedicated-announcer
