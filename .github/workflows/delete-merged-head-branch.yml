name: Finalize AQP v0.8.1 after verified main

on:
  workflow_run:
    workflows:
      - Verify source and generated release
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      RELEASE_BRANCH: release/v0.8.1-curation
      RELEASE_TAG: v0.8.1
      V080_COMMIT: ef3f46614bc3b40d02de1665a2901d017a5e00ab
      INVENTORY: docs/archive/BRANCH-CLEANUP-INVENTORY-v0.8.1.json
      VERIFIED_MAIN_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the verified main revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refuse stale or moved release state
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --tags origin
          test "$(git rev-parse origin/main)" = "$VERIFIED_MAIN_SHA"
          test "$(git rev-parse 'refs/tags/v0.8.0^{commit}')" = "$V080_COMMIT"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$VERIFIED_MAIN_SHA"
            echo "$RELEASE_TAG already identifies this exact verified revision; nothing to recreate."
            exit 1
          fi

      - name: Delete only the merged v0.8.1 source branch
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          if git show-ref --verify --quiet "refs/remotes/origin/$RELEASE_BRANCH"; then
            release_sha="$(git rev-parse "refs/remotes/origin/$RELEASE_BRANCH")"
            git merge-base --is-ancestor "$release_sha" "$VERIFIED_MAIN_SHA"
            git push origin --delete "$RELEASE_BRANCH"
            printf '%s\n' "$release_sha" > /tmp/deleted-release-branch-sha.txt
          else
            printf '%s\n' 'already-absent' > /tmp/deleted-release-branch-sha.txt
          fi

      - name: Record post-merge cleanup and remove this one-time workflow
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['INVENTORY'])
          data = json.loads(path.read_text(encoding='utf-8'))
          deleted_sha = Path('/tmp/deleted-release-branch-sha.txt').read_text(encoding='utf-8').strip()
          data['cleanupStatus'] = 'complete-after-merge'
          data['postMergeRelease'] = {
              'completedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'verifiedMainBeforeHousekeeping': os.environ['VERIFIED_MAIN_SHA'],
              'deletedActivePullRequestBranch': os.environ['RELEASE_BRANCH'],
              'deletedActivePullRequestBranchSha': deleted_sha,
              'archiveBranch': 'archive/pre-v0.8.1-branch-tips',
              'v0.8.0ResolvedCommit': os.environ['V080_COMMIT'],
              'releaseTagPlannedAfterHousekeepingVerification': os.environ['RELEASE_TAG'],
          }
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY

          rm .github/workflows/delete-merged-head-branch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$INVENTORY" .github/workflows/delete-merged-head-branch.yml
          git diff --cached --check
          git commit -m "chore: finalize v0.8.1 release housekeeping"
          housekeeping_sha="$(git rev-parse HEAD)"
          printf '%s\n' "$housekeeping_sha" > /tmp/housekeeping-sha.txt
          git push origin HEAD:main

      - name: Wait for the housekeeping revision to pass the full main workflow
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          sha = Path('/tmp/housekeeping-sha.txt').read_text(encoding='utf-8').strip()
          workflow_name = 'Verify source and generated release'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'AQP-v0.8.1-post-merge-finalizer',
          }
          deadline = time.time() + 1200
          seen = None
          while time.time() < deadline:
              query = urllib.parse.urlencode({'head_sha': sha, 'event': 'push', 'per_page': 50})
              url = f'https://api.github.com/repos/{repo}/actions/runs?{query}'
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  runs = json.load(response)['workflow_runs']
              matching = [run for run in runs if run['name'] == workflow_name]
              if matching:
                  seen = matching[0]
                  print(f"Housekeeping verify run {seen['id']}: {seen['status']} / {seen['conclusion']}")
                  if seen['status'] == 'completed':
                      if seen['conclusion'] != 'success':
                          raise SystemExit(
                              f"Housekeeping revision failed verification: {seen['html_url']}"
                          )
                      Path('/tmp/housekeeping-verify-run.txt').write_text(str(seen['id']) + '\n')
                      break
              time.sleep(15)
          else:
              raise SystemExit(f'Timed out waiting for full verification of {sha}; last run={seen}')
          PY

      - name: Create the immutable v0.8.1 tag only from the fully verified clean tree
        run: |
          housekeeping_sha="$(cat /tmp/housekeeping-sha.txt)"
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$housekeeping_sha"
          test "$(git rev-parse 'refs/tags/v0.8.0^{commit}')" = "$V080_COMMIT"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "$RELEASE_TAG unexpectedly exists; refusing to move it." >&2
            exit 1
          fi
          git tag -a "$RELEASE_TAG" "$housekeeping_sha" -m "Accessible Questionnaire Platform v0.8.1"
          git push origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$housekeeping_sha"
          test "$(git rev-parse 'refs/tags/v0.8.0^{commit}')" = "$V080_COMMIT"
          echo "Published immutable $RELEASE_TAG at $housekeeping_sha after full main verification."
