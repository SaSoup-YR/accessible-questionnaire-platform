name: Delete exact merged head branch

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

jobs:
  delete:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the unchanged merged head ref
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          event = json.loads(Path(os.environ['EVENT_PATH']).read_text(encoding='utf-8'))
          repo = event['repository']['full_name']
          pull = event['pull_request']
          branch = pull['head']['ref']
          expected_sha = pull['head']['sha']

          if branch in {'main', 'gh-pages'} or branch.startswith('archive/'):
              raise SystemExit(f'Refusing to delete protected branch: {branch}')

          encoded = urllib.parse.quote(branch, safe='/')
          url = f'https://api.github.com/repos/{repo}/git/refs/heads/{encoded}'
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'AQP-merged-branch-cleanup',
          }

          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  ref = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  print(f'Branch already absent: {branch}')
                  raise SystemExit(0)
              raise

          actual_sha = ref['object']['sha']
          if actual_sha != expected_sha:
              raise SystemExit(
                  f'Refusing to delete {branch}: live SHA {actual_sha} no longer matches merged PR head {expected_sha}.'
              )

          request = urllib.request.Request(url, headers=headers, method='DELETE')
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit(f'Unexpected deletion status: {response.status}')
          print(f'Deleted merged branch {branch} at exact SHA {expected_sha}.')
          PY
