name: Curate v0.8.1 evidence records once

on:
  pull_request:

permissions:
  contents: write

jobs:
  curate:
    if: github.event.pull_request.head.ref == 'release/v0.8.1-curation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the curation branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.8.1-curation
          fetch-depth: 5

      - name: Move records and update exact references
        run: |
          python - <<'PY'
          from pathlib import Path

          moves = {
              'docs/evidence/RF04-NATIVE-DIALOG-SUCCESSOR-PLAN-2026-08-22.md':
                  'docs/evidence/RF04-NATIVE-DIALOG-FINAL-IMPLEMENTATION-EVIDENCE-2026-08-22.md',
              'docs/evidence/RF05-AUTOMATED-REPAIR-CANDIDATE-2026-08-20.md':
                  'docs/evidence/RF05-A22-FINAL-POSTFIX-EVIDENCE-2026-08-21.md',
              'docs/evidence/RF06-REPAIR-PLAN-2026-08-21.md':
                  'docs/evidence/RF06-FINAL-POSTFIX-EVIDENCE-2026-08-21.md',
              'docs/evidence/RF07-A11-A12-REPAIR-PLAN-2026-08-21.md':
                  'docs/archive/evidence/RF07-A11-A12-REPAIR-PLAN-2026-08-21.md',
              'docs/evidence/RF08-A29-REPAIR-CANDIDATE-2026-08-21.md':
                  'docs/archive/evidence/RF08-A29-REPAIR-CANDIDATE-2026-08-21.md',
          }

          for source_name, target_name in moves.items():
              source = Path(source_name)
              target = Path(target_name)
              if not source.is_file():
                  raise SystemExit(f'missing source: {source_name}')
              if target.exists():
                  raise SystemExit(f'target already exists: {target_name}')
              target.parent.mkdir(parents=True, exist_ok=True)
              source.rename(target)

          replacements = {
              **moves,
              '# RF-04 / R3-A14 native recovery-dialog successor — 22 August 2026':
                  '# RF-04 / R3-A14 final native recovery-dialog implementation evidence — 22 August 2026',
              '- final native-dialog candidate: `0444d6f8a3a77f7cb9409d79c01a75ff42d9471d`;':
                  '- final native-dialog implementation candidate: `0444d6f8a3a77f7cb9409d79c01a75ff42d9471d`;',
              '- The earlier RF-07 repair-plan record for the complete standards/open-source comparison and stop rules.':
                  '- Archived planning record `docs/archive/evidence/RF07-A11-A12-REPAIR-PLAN-2026-08-21.md` for the complete standards/open-source comparison and stop rules.',
          }

          allowed_suffixes = {
              '.md', '.json', '.txt', '.html', '.ts', '.mjs', '.js', '.yml', '.yaml', '.cff'
          }
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in allowed_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          for source_name, target_name in moves.items():
              if Path(source_name).exists():
                  raise SystemExit(f'old path still exists: {source_name}')
              if not Path(target_name).is_file():
                  raise SystemExit(f'new path missing: {target_name}')

          remaining = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for old in moves:
                  if old in text:
                      remaining.append(f'{path}: {old}')
          if remaining:
              raise SystemExit('stale path references remain:\n' + '\n'.join(remaining))
          PY

      - name: Verify current and archived evidence boundary
        run: |
          test -e docs/evidence/RF04-NATIVE-DIALOG-FINAL-IMPLEMENTATION-EVIDENCE-2026-08-22.md
          test -e docs/evidence/RF05-A22-FINAL-POSTFIX-EVIDENCE-2026-08-21.md
          test -e docs/evidence/RF06-FINAL-POSTFIX-EVIDENCE-2026-08-21.md
          test -e docs/archive/evidence/RF07-A11-A12-REPAIR-PLAN-2026-08-21.md
          test -e docs/archive/evidence/RF08-A29-REPAIR-CANDIDATE-2026-08-21.md
          git diff --check

      - name: Remove this one-time workflow
        run: rm .github/workflows/v081-evidence-curation-once.yml

      - name: Commit the exact curation result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: curate final and archived repair evidence"
          git push origin HEAD:release/v0.8.1-curation
