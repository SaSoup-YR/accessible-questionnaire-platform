name: RF-09 one-time final-channel release sync

on:
  push:
    branches:
      - agent/fix-rf09-support-setting-feedback
    paths:
      - '.github/workflows/rf09-final-channel-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact RF-09 branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-rf09-support-setting-feedback
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: Re-run unit and component tests before generation
        working-directory: source
        run: npm test -- --run

      - name: Generate production, standalone and release outputs
        working-directory: source
        run: npm run build:release

      - name: Commit synchronized release and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/rf09-final-channel-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          CHANGED="$(git diff --cached --name-only)"
          printf '%s\n' "$CHANGED"
          test -n "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -Ev '^(.github/workflows/rf09-final-channel-sync.yml|assets/|index.html$|study.html$|questionnaires/|source/demo/)' | grep -q .; then
            echo 'Unexpected source or evidence path changed during generated-release sync.' >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m '[rf09-final-sync] Synchronize one-channel RF-09 release'
          git push origin HEAD:agent/fix-rf09-support-setting-feedback
